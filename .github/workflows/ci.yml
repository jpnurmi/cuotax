name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint
            runner: ubuntu-26.04
            npm: true
            targets: lint
          - name: format
            runner: ubuntu-26.04
            npm: true
            targets: format-check
          - name: build
            runner: ubuntu-26.04
            apt: gnome-shell unzip
            targets: verify
          - name: test
            runner: ubuntu-26.04
            apt: gjs
            targets: test
          - name: macos-26
            runner: macos-26
            npm: true
            targets: format-check test verify

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system tools
        if: matrix.apt
        env:
          PACKAGES: ${{ matrix.apt }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes $PACKAGES

      - name: Install JavaScript tools
        if: matrix.npm
        run: npm ci

      - name: Run checks
        env:
          TARGETS: ${{ matrix.targets }}
        run: make $TARGETS
