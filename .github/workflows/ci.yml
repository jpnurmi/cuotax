name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, macos-26, windows-2025]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GNU Make
        if: ${{ runner.os == 'Windows' }}
        run: choco install make --yes --no-progress

      - name: Install JavaScript tools
        run: npm ci
        working-directory: gnome

      - name: Lint
        run: make lint

  format:
    name: format (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, macos-26, windows-2025]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GNU Make
        if: ${{ runner.os == 'Windows' }}
        run: choco install make --yes --no-progress

      - name: Set up .NET
        if: ${{ runner.os == 'Windows' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install JavaScript tools
        run: npm ci
        working-directory: gnome

      - name: Check formatting
        run: make format-check

  build:
    name: build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
          - runner: macos-26
          - runner: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GNU Make
        if: ${{ runner.os == 'Windows' }}
        run: choco install make --yes --no-progress

      - name: Set up .NET
        if: ${{ runner.os == 'Windows' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install Linux dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnome-shell unzip

      - name: Build
        run: make build

      - name: Verify
        run: make verify

  test:
    name: test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
          - runner: macos-26
          - runner: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GNU Make
        if: ${{ runner.os == 'Windows' }}
        run: choco install make --yes --no-progress

      - name: Set up .NET
        if: ${{ runner.os == 'Windows' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install Linux dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes gir1.2-soup-3.0 gjs

      - name: Test
        run: make test

  screenshot:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: ubuntu-26.04
            platform: gnome
          - runner: macos-26
            platform: macos
          - runner: windows-2025
            platform: windows

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: ${{ github.event_name == 'pull_request' }}

      - name: Install GNU Make
        if: ${{ runner.os == 'Windows' }}
        run: choco install make --yes --no-progress

      - name: Set up .NET
        if: ${{ runner.os == 'Windows' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install Linux dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-cantarell gir1.2-pango-1.0 gjs

      - name: Generate screenshot
        run: make screenshot
        env:
          LANG: en_US.UTF-8
          TZ: UTC

      - name: Commit screenshot
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p .github/screenshots
          cp "dist/screenshots/${PLATFORM}.png" .github/screenshots/
          git add ".github/screenshots/${PLATFORM}.png"
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update ${PLATFORM} screenshot"
          git push origin "HEAD:refs/heads/${HEAD_REF}"
