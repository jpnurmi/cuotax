name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, macos-26, windows-2025]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GNU Make
        if: ${{ runner.os == 'Windows' }}
        run: choco install make --yes --no-progress

      - name: Install JavaScript tools
        run: npm ci

      - name: Lint
        run: make lint

  format:
    name: format (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, macos-26, windows-2025]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GNU Make
        if: ${{ runner.os == 'Windows' }}
        run: choco install make --yes --no-progress

      - name: Set up .NET
        if: ${{ runner.os == 'Windows' }}
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Install JavaScript tools
        run: npm ci

      - name: Check formatting
        run: make format-check

  build:
    name: build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
          - runner: macos-26
          - runner: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GNU Make
        if: ${{ runner.os == 'Windows' }}
        run: choco install make --yes --no-progress

      - name: Set up .NET
        if: ${{ runner.os == 'Windows' }}
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Install Linux dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnome-shell unzip

      - name: Build
        run: make build

      - name: Verify
        run: make verify

  test:
    name: test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
          - runner: macos-26
          - runner: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GNU Make
        if: ${{ runner.os == 'Windows' }}
        run: choco install make --yes --no-progress

      - name: Set up .NET
        if: ${{ runner.os == 'Windows' }}
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Install Linux dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes gjs

      - name: Test
        run: make test
